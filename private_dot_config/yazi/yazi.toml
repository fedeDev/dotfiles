[mgr]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true

[preview]
tab_size = 2
max_width = 1200
max_height = 1800

[plugin]
prepend_previewers = [
  # Local zoom.yazi variant: fit images to the preview column by default.
  { mime = "image/*", run = "zoom-fit" },
]

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
