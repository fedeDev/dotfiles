add_newline = false
format = "${custom.worktree}$directory$git_branch$git_status$cmd_duration$fill$time$line_break$character"
palette = "catppuccin_mocha"

[character]
error_symbol = "[>](red)"
success_symbol = "[>](mauve)"

[cmd_duration]
format = "[$duration]($style) "
min_time = 500
style = "yellow"

[custom.worktree]
command = "printf wt"
description = "linked Git worktree marker"
format = "[$output]($style) "
require_repo = true
shell = ["sh"]
style = "bold yellow"
when = "git_dir=$(git rev-parse --git-dir 2>/dev/null) && test -f \"$git_dir/commondir\""

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold blue"
truncate_to_repo = false
truncation_length = 4

[fill]
symbol = " "

[time]
disabled = false
format = "[$time]($style)"
style = "subtext0"
time_format = "%Y-%m-%d %H:%M"

[git_branch]
style = "mauve"

[git_status]
style = "peach"

[palettes.catppuccin_mocha]
base = "#1e1e2e"
blue = "#89b4fa"
crust = "#11111b"
flamingo = "#f2cdcd"
green = "#a6e3a1"
lavender = "#b4befe"
mantle = "#181825"
maroon = "#eba0ac"
mauve = "#cba6f7"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
peach = "#fab387"
pink = "#f5c2e7"
red = "#f38ba8"
rosewater = "#f5e0dc"
sapphire = "#74c7ec"
sky = "#89dceb"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
teal = "#94e2d5"
